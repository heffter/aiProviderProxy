# Quality gates (epic AIPP-2, subtask 2.2).
#
# Runs the AIPP-2+ quality gates on every PR and push to main: Prettier format
# check, ESLint (zero warnings), strict TypeScript typecheck of new code, Vitest
# with 80% line / 70% branch coverage over new source, and a trivy scan. These
# gates cover new code only; legacy RelayPlane sources are excluded until
# migrated. Configure this job as a required status check on main.
name: Quality gates (AIPP-2)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    name: Format, lint, typecheck, coverage, scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Skip native build scripts (better-sqlite3) the gates do not need.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck (new code)
        run: npm run typecheck

      - name: Vitest with coverage (80 line / 70 branch)
        run: npm run test:gates

      - name: Trivy filesystem scan (secrets, HIGH/CRITICAL vulns)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: node_modules,dist,coverage
